name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustup show
          cargo --version

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release

      - name: Verify binaries exist and print hashes
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path target/release -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) { Write-Error 'FAIL: no .exe files in target/release'; exit 1 }
          foreach ($e in $exes) { '{0}  {1} bytes  sha256={2}' -f $e.Name, $e.Length, (Get-FileHash -LiteralPath $e.FullName -Algorithm SHA256).Hash }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvd-ripper-windows
          path: target/release/*.exe
          if-no-files-found: error
